resources:
  stack:
    type: module.app_stack
    # `network` is declared in resources/network/. A directory scopes
    # variables, never names.
    network: ${network.id}
    size: ${var.size}
    password: ${var.db_password}
    # A map whose values interpolate, crossing the module boundary as ONE input.
    # `environment` and `project` come from the invocation, so production gets
    # different values here and the module needs no knowledge of that.
    #
    # It cannot live in a variables file: a variable is resolved before any
    # expression scope exists, so `${...}` there has nothing to refer to.
    tags:
      environment: ${var.environment}
      project: ${var.project}
      team: storefront

  web:
    type: fake.application
    image: nginx:1.27
    database_url: ${stack.endpoint}
