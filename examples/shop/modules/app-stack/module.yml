inputs:
  network:
    type: string
  size:
    type: integer
    default: 10
  password:
    type: string
  tags:
    type: map
    default: {}
resources:
  db:
    type: fake.database
    engine: postgres
    network: ${network}
    size: ${size}
    password: ${password}
    tags: ${tags}
outputs:
  endpoint:
    value: ${db.endpoint}
